services:
  # Base de Datos
  db:
    image: postgres:15-alpine
    container_name: tienda-db
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tienda_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d tienda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (Java Spring Boot)
  backend:
    build: ./backend
    container_name: tienda-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tienda_db
      SPRING_DATASOURCE_USERNAME: user_admin
      SPRING_DATASOURCE_PASSWORD: password123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Frontend (Angular)
  frontend:
    build: ./frontend
    container_name: tienda-web
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data: